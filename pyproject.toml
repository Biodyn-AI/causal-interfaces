[project]
name = "causal-interfaces"
version = "1.0.0"
description = "Reproducible activation-patching experiments across transformer scales"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Ihor Kendiukhov", email = "ihor.kendiukhov@student.uni-tuebingen.de"},
]
dependencies = [
  "torch==2.13.0",
  "numpy==2.5.1",
  "einops==0.8.2",
  "transformers==5.14.1",
  "safetensors==0.8.0",
  "matplotlib==3.11.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.urls]
Repository = "https://github.com/Biodyn-AI/causal-interfaces"
Releases = "https://github.com/Biodyn-AI/causal-interfaces/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -m "not original_checkout"'
markers = [
  "original_checkout: requires immutable absolute-path records from the original acquisition checkout",
]

