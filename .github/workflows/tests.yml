name: publication checks

on:
  push:
  pull_request:

jobs:
  replay-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Replay sealed scores
        run: make replay PYTHON=python
      - name: Run focused tests
        run: make test PYTHON=python
      - name: Regenerate figures
        run: make figures PYTHON=python
